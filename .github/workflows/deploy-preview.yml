name: Deploy Kreatazz Preview to GoDaddy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: kreatazz-godaddy-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: deploy_to_godaddy
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      - name: Validate deployment secrets
        shell: bash
        run: |
          missing=()

          [ -n "$FTP_SERVER" ] || missing+=("FTP_SERVER")
          [ -n "$FTP_USERNAME" ] || missing+=("FTP_USERNAME")
          [ -n "$FTP_PASSWORD" ] || missing+=("FTP_PASSWORD")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Deploy dist to GoDaddy preview folder
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: false
