name: Deploy Kreatazz Preview to GoDaddy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: kreatazz-godaddy-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: deploy_to_godaddy
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR || '/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      - name: Validate deployment secrets
        shell: bash
        run: |
          missing=()

          [ -n "$FTP_SERVER" ] || missing+=("FTP_SERVER")
          [ -n "$FTP_USERNAME" ] || missing+=("FTP_USERNAME")
          [ -n "$FTP_PASSWORD" ] || missing+=("FTP_PASSWORD")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Normalize and validate FTP host
        shell: bash
        run: |
          # Accept either host-only or URL-like input and normalize to host for the action.
          host="$FTP_SERVER"
          host="${host#ftp://}"
          host="${host#ftps://}"
          host="${host%%/*}"
          host="${host%%:*}"
          host="$(echo "$host" | tr -d '\r\n\t ' )"

          if [ -z "$host" ]; then
            echo "::error::FTP_SERVER resolves to an empty host after normalization"
            exit 1
          fi

          if ! getent ahosts "$host" >/dev/null 2>&1; then
            echo "::error::FTP host does not resolve in DNS: $host"
            echo "::error::Use a real FTP hostname from GoDaddy/cPanel (not SFTP host and not full URL path)."
            exit 1
          fi

          echo "FTP_SERVER_HOST=$host" >> "$GITHUB_ENV"

      - name: Deploy dist to GoDaddy preview folder
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_SERVER_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || vars.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./dist/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          dangerous-clean-slate: true
